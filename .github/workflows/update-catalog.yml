name: Update public job catalog

on:
  schedule:
    # Five-hour cadence: 00:17, 05:17, 10:17, 15:17, 20:17 UTC.
    # The staggered minute avoids the top-of-hour burst on shared runners.
    - cron: "17 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install collector dependencies
        run: python -m pip install -r collector/requirements.txt
      - name: Run reviewed live catalog build
        if: vars.AUTUMN_LIVE_COLLECTION == 'true'
        env:
          REQUIRED_SOURCES: ${{ vars.AUTUMN_REQUIRED_SOURCES || '20' }}
        run: python -m collector.cli --sources registry/sources.json --focus registry/internet-focus.json --state collector/state.json --output apps/web/public/data --min-verified-sources "$REQUIRED_SOURCES"
      - name: Verify release gate
        if: vars.AUTUMN_LIVE_COLLECTION == 'true'
        env:
          REQUIRED_SOURCES: ${{ vars.AUTUMN_REQUIRED_SOURCES || '20' }}
        run: python -m collector.release_gate --manifest apps/web/public/data/manifest.json --catalog apps/web/public/data/catalog.json --jobs-dir apps/web/public/data/jobs --companies apps/web/public/data/companies.json --min-verified-sources "$REQUIRED_SOURCES"
      - name: Generate company coverage and source audit
        if: vars.AUTUMN_LIVE_COLLECTION == 'true'
        run: |
          python -m collector.discovery --companies registry/companies.json --sources registry/sources.json --focus registry/internet-focus.json --authorities registry/candidate-discovery-sources.json --authority-index registry/internet-authority-top100.json --hiring-radar registry/hiring-radar-seed.json --check-authorities --output artifacts/source-coverage.json
          python -m collector.candidate_sync --companies registry/companies.json --sources registry/sources.json --focus registry/internet-focus.json --authorities registry/candidate-discovery-sources.json --authority-index registry/internet-authority-top100.json --hiring-radar registry/hiring-radar-seed.json --output artifacts/company-candidate-backlog.json
          python -m collector.authority_index --companies registry/companies.json --authority registry/internet-authority-top100.json --output artifacts/internet-authority-import.json
          python -m collector.hiring_radar --companies registry/companies.json --seed registry/hiring-radar-seed.json --output artifacts/hiring-radar-import.json
          python -m collector.directory_cli --companies registry/companies.json --sources registry/sources.json --data apps/web/public/data --entry-state collector/company-directory-state.json
          python -m collector.audit --catalog apps/web/public/data/catalog.json --sources registry/sources.json --output artifacts/source-audit.json --check-links
          python -m collector.health --sources apps/web/public/data/sources.json --state collector/state.json --output artifacts/source-health.json
      - name: Run collector tests
        run: python -m pytest tests
      - name: Commit changed catalog and report
        if: vars.AUTUMN_LIVE_COLLECTION == 'true'
        run: |
          git config user.name "autumn-assistant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data collector/state.json artifacts/source-coverage.json artifacts/company-candidate-backlog.json artifacts/source-audit.json artifacts/source-health.json artifacts/audience-filter-report.json artifacts/internet-authority-import.json artifacts/hiring-radar-import.json
          git diff --cached --quiet || git commit -m "chore(data): update public catalog"
          git push
